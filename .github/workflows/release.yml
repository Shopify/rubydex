name: "Package and release the gem and the crates"
on:
  # Manually trigger a dry-run that doesn't publish to RubyGems or crates.io
  workflow_dispatch:
  # Trigger release flow through pushing tags
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+.beta[0-9]*

permissions:
  contents: read

jobs:
  verify_version:
    timeout-minutes: 5
    name: "Verify the tag matches the declared version"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout code"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
      - name: "Setup Ruby"
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.2.9"
      - name: "Verify exact workspace dependency versions"
        run: |
          metadata="$(cargo metadata --no-deps --format-version 1 --manifest-path rust/Cargo.toml)"
          ruby -rjson -e '
            metadata = JSON.parse($stdin.read)
            packages = metadata.fetch("packages")
            rubydex = packages.find { |package| package.fetch("name") == "rubydex" }
            rubydex_sys = packages.find { |package| package.fetch("name") == "rubydex-sys" }
            requirement = rubydex_sys.fetch("dependencies").find { |dependency| dependency.fetch("name") == "rubydex" }.fetch("req")
            expected = "=#{rubydex.fetch("version")}"

            if requirement != expected
              abort "rubydex-sys requires rubydex #{requirement.inspect}; expected #{expected.inspect}"
            end
          ' <<<"$metadata"

      - name: "Verify the tag matches the declared version"
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          declared="$(ruby -r./lib/rubydex/version -e 'print Rubydex::VERSION')"
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tagged" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the declared version ${declared}" >&2
            exit 1
          fi
  compile:
    timeout-minutes: 20
    needs: verify_version
    name: "Cross compile the gem on different ruby versions"
    strategy:
      matrix:
        os: ["macos-latest", "macos-26-intel", "ubuntu-22.04", "ubuntu-22.04-arm", "windows-latest"]
    runs-on: "${{ matrix.os }}"
    env:
      RELEASE: "true"
    steps:
      - name: "Checkout code"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
      - name: "Setup Ruby"
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.2.9"
          bundler-cache: true
      - name: "Install cargo-about"
        run: cargo install cargo-about --features cli
      - name: "Run cibuildgem"
        uses: "shopify/cibuildgem/.github/actions/cibuildgem@main"
        with:
          step: "compile"
  test:
    timeout-minutes: 20
    name: "Run the test suite"
    needs: compile
    strategy:
      matrix:
        os: ["macos-latest", "macos-26-intel", "ubuntu-22.04", "ubuntu-22.04-arm", "windows-latest"]
        rubies: ["3.2", "3.3", "3.4", "4.0"]
        type: ["cross", "native"]
    runs-on: "${{ matrix.os }}"
    steps:
      - name: "Checkout code"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
      - name: "Setup Ruby"
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "${{ matrix.rubies }}"
          bundler-cache: true
      - name: "Run cibuildgem"
        uses: "shopify/cibuildgem/.github/actions/cibuildgem@main"
        with:
          step: "test_${{ matrix.type }}"
  install:
    timeout-minutes: 10
    name: "Verify the gem can be installed"
    needs: test
    strategy:
      matrix:
        os: ["macos-latest", "macos-26-intel", "ubuntu-22.04", "ubuntu-22.04-arm", "windows-latest"]
    runs-on: "${{ matrix.os }}"
    steps:
      - name: "Setup Ruby"
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0.0"
      - name: "Run cibuildgem"
        uses: "shopify/cibuildgem/.github/actions/cibuildgem@main"
        with:
          step: "install"
  release:
    environment: release
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 5
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: "Release all gems with RubyGems"
    needs: install
    runs-on: "ubuntu-latest"
    steps:
      - name: "Setup Ruby"
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0.0"
      - name: "Run cibuildgem"
        uses: "shopify/cibuildgem/.github/actions/cibuildgem@main"
        with:
          step: "release"
  release_crates:
    environment: release
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 30
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: "Release all crates with crates.io"
    needs: release
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout code"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
      - name: "Setup Rust"
        run: |
          rustup update --no-self-update stable
          rustup default stable
      # The trusted publisher must match this repository, workflow, and environment
      # for both crates.
      - name: "Exchange the Actions identity token for a crates.io token"
        id: "crates_io_auth"
        uses: "rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18" # v1.0.5
      - name: "Publish the crates"
        run: cargo publish --workspace --manifest-path rust/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: "${{ steps.crates_io_auth.outputs.token }}"
  release_github:
    permissions:
      contents: write
    name: Create GitHub release
    needs: release_crates
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          script: |
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: "${{ github.ref }}",
              name: "${{ github.ref_name }}",
              generate_release_notes: true,
              prerelease: "${{ github.ref_name }}".includes(".beta")
            });
